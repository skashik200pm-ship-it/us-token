<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>US TOKEN - Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-light: #ffe787;
      --gold-main: #f6c945;
      --gold-dark: #b6841c;
      --bg-dark: #070a10;
      --card-bg: rgba(16, 20, 29, 0.9);
      --border-gold: rgba(246, 201, 69, 0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #040609;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 35%, rgba(246, 201, 69, 0.14) 0%, rgba(11, 15, 24, 0.4) 45%, rgba(7, 10, 16, 1) 80%),
        linear-gradient(180deg, #0b0f17 0%, #070a10 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    .app-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 215, 100, 0.04) 1px, transparent 0);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    .content-layer {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 16px;
    }

    .gold-text {
      background: linear-gradient(180deg, #fff3b8 0%, #f6c945 50%, #c89116 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ribbon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px auto 12px;
      width: 92%;
      height: 40px;
    }

    .ribbon-tail-left,
    .ribbon-tail-right {
      position: absolute;
      top: 6px;
      width: 24px;
      height: 30px;
      background: linear-gradient(180deg, #9c6e14 0%, #6e4a09 100%);
      z-index: 1;
    }

    .ribbon-tail-left {
      left: -8px;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 28% 50%);
    }

    .ribbon-tail-right {
      right: -8px;
      clip-path: polygon(0 0, 100% 0, 72% 50%, 100% 100%, 0 100%);
    }

    .ribbon-body {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #fce38a 0%, #e5b338 48%, #b98518 100%);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.7);
      border-top: 1px solid #fff2b2;
      border-bottom: 1px solid #8a5e0b;
    }

    .ribbon-body span {
      color: #1c1404;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .gold-card {
      background: linear-gradient(180deg, rgba(22, 27, 38, 0.85) 0%, rgba(12, 15, 22, 0.95) 100%);
      border: 1px solid rgba(246, 201, 69, 0.24);
      border-radius: 10px;
      box-shadow: inset 0 1px 0 rgba(255, 231, 135, 0.08), 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    /* Slow 3D Rotation for the Ethereum Diamond Logo */
    @keyframes spinEthSlow {
      0% { transform: scaleX(1) translateY(0px); }
      25% { transform: scaleX(0.35) translateY(-2px); }
      50% { transform: scaleX(-1) translateY(0px); }
      75% { transform: scaleX(-0.35) translateY(-2px); }
      100% { transform: scaleX(1) translateY(0px); }
    }

    .eth-spin-slow {
      transform-origin: 0px 0px;
      animation: spinEthSlow 7s linear infinite;
    }

    .eth-spin-active {
      transform-origin: 0px 0px;
      animation: spinEthSlow 4.5s linear infinite;
    }

    @keyframes floatCoin {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 16px rgba(246, 201, 69, 0.35)); }
      50% { filter: drop-shadow(0 0 28px rgba(246, 201, 69, 0.65)); }
    }

    .coin-active {
      animation: floatCoin 3s ease-in-out infinite, pulseGlow 2.5s ease-in-out infinite;
    }

    .coin-idle {
      filter: drop-shadow(0 0 14px rgba(246, 201, 69, 0.22));
      transition: all 0.3s ease;
    }

    .start-btn {
      background: linear-gradient(180deg, #ffe169 0%, #f5c332 55%, #d99f14 100%);
      color: #120d02;
      font-weight: 800;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(245, 195, 50, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.7);
      transition: transform 0.12s ease, box-shadow 0.2s ease;
    }

    .start-btn:active {
      transform: scale(0.98);
    }

    .start-btn.mining-on {
      background: linear-gradient(180deg, #34d399 0%, #10b981 55%, #059669 100%);
      color: #031c12;
      box-shadow: 0 4px 22px rgba(16, 185, 129, 0.38), inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    @keyframes blinkLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .live-dot {
      animation: blinkLive 1.
