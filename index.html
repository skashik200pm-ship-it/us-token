body{background:#000;color:#fff;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100vh;background:#050505;padding:14px 14px 20px;position:relative;overflow:hidden}
/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;background:#0a0a0a;border-radius:16px;padding:12px}

.flag{width:38px;height:38px;border-radius:50%;background:conic-gradient(#b31942 0 25%,#fff 0 50%,#0a3161 0 75%,#fff 0);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;border:1px solid #333}
.flag span{font-size:22px}
.header h1{font-size:22px;letter-spacing:.5px}
.live{border:1px solid #ff2d2d;color:#ff2d2d;font-size:12px;font-weight:700;padding:5px 8px;border-radius:8px}

.wallet-note{text-align:center;font-size:11px;color:#e8c87a;margin:12px 0 6px;letter-spacing:.2px}

.coin-wrap{position:relative;width:260px;height:260px;margin:10px auto 0;display:flex;align-items:center;justify-content:center}

.coin{width:225px;height:225px;border-radius:50%;z-index:2;position:relative;background:radial-gradient(circle at 30% 25%,#fff3a0,#ffd700 30%,#b8860b 55%,#8b6500 75%,#ffd700);border:4px solid #e6b800;box-shadow:0 0 40px rgba(255,180,0,.55),inset 0 0 20px rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;flex-direction:column}
.coin-inner{width:185px;height:185px;border-radius:50%;border:2px solid rgba(139,101,0,.6);display:flex;align-items:center;justify-content:center;position:relative}
.eth{font-size:105px;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}

.us-badge::after{content:'★ ★ ★';display:block;font-size:7px;text-align:center;color:#fff}
.ribbon{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:150px;height:28px;background:linear-gradient(180deg,#ffe27a,#d4a017);z-index:1;border-radius:4px}
.coin-title{text-align:center;margin-top:18px}
.coin-title h2{color:#f5d67a;font-size:26px;letter-spacing:1px}
.coin-title p{color:#c9b896;font-size:14px;margin-top:2px}
/* EXCHANGE RIBBON */
.exchange{margin:14px 0;background:linear-gradient(180deg,#ffe27a,#d4a017);color:#1a1a1a;text-align:center;font-weight:900;font-size:19px;padding:11px;border-radius:2px;position:relative;box-shadow:0 4px 0 #8b6500}
.exchange::before,.exchange::after{content:'';position:absolute;top:0;width:18px;height:100%;background:#b8860b;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.exchange::before{left:-10px;transform:scaleX(-1)}
.exchange::after{right:-10px}
