<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>US TOKEN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;background:#06080d;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
body{display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;background:radial-gradient(circle at 50% 35%,rgba(246,201,69,.15),#070a10 75%);display:flex;flex-direction:column;justify-content:space-between;position:relative}
.gold{background:linear-gradient(180deg,#fff3b8,#f6c945 55%,#c89116);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:linear-gradient(180deg,rgba(22,27,38,.9),rgba(12,15,22,.96));border:1px solid rgba(246,201,69,.26);border-radius:10px}
.btn-gold{background:linear-gradient(180deg,#ffe169,#f5c332 55%,#d99f14);color:#120d02;font-weight:800;border-radius:12px;box-shadow:0 4px 18px rgba(245,195,50,.35)}
.btn-gold.active{background:linear-gradient(180deg,#34d399,#10b981 55%,#059669);color:#031c12;box-shadow:0 4px 18px rgba(16,185,129,.4)}
.ribbon{position:relative;margin:6px auto 10px;width:90%;height:36px;background:linear-gradient(180deg,#fce38a,#e5b338 50%,#b98518);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#1c1404;font-weight:800;font-size:13px;box-shadow:0 5px 15px rgba(0,0,0,.6)}
@keyframes spinSlow{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
.eth-spin{transform-origin:130px 116px;animation:spinSlow 7s linear infinite}
.eth-spin.fast{animation-duration:3.5s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.dot{animation:blink 1.4s infinite}
.nav{width:100%;height:64px;background:#0b0f17;border-top:1px solid rgba(246,201,69,.22);display:grid;grid-template-columns:repeat(5,1fr);z-index:40;flex-shrink:0}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#7c8596;font-size:10.5px;background:none;border:none;cursor:pointer}
.nav button.on{color:#f6c945;font-weight:700}
.tab{display:none;flex-direction:column;padding:6px 14px 12px;flex:1}.tab.on{display:flex}
#toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#161c28;border:1px solid #f6c945;color:#ffe787;padding:7px 15px;border-radius:99px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
#toast.show{opacity:1}
#wModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:80;align-items:flex-end;justify-content:center}
#wModal.show{display:flex}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app">
<div>

          <rect width="32" height="34" fill="#3c3b6e"/>
