.input{width:100%;background:#0d0d0d;border:1px solid #333;color:#fff;padding:14px;border-radius:10px;margin-top:10px;font-size:14px;outline:none}

#timer{font-size:44px;color:#FFD700;margin:16px 0;font-weight:900}
#claimBtn{display:none;background:#FFD700;color:#000;border:none;width:100%;padding:16px;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer}
