<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>US TOKEN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:#06080d;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:430px;min-height:100vh;background:radial-gradient(circle at 50% 35%,rgba(246,201,69,.15),#070a10 75%);display:flex;flex-direction:column;padding-bottom:76px;position:relative}
.gold{background:linear-gradient(180deg,#fff3b8,#f6c945 55%,#c89116);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:linear-gradient(180deg,rgba(22,27,38,.9),rgba(12,15,22,.96));border:1px solid rgba(246,201,69,.26);border-radius:10px}
.btn-gold{background:linear-gradient(180deg,#ffe169,#f5c332 55%,#d99f14);color:#120d02;font-weight:800;border-radius:12px;box-shadow:0 4px 18px rgba(245,195,50,.35)}
.btn-gold.active{background:linear-gradient(180deg,#34d399,#10b981 55%,#059669);color:#031c12;box-shadow:0 4px 18px rgba(16,185,129,.4)}
.ribbon{position:relative;margin:6px auto 10px;width:90%;height:38px;background:linear-gradient(180deg,#fce38a,#e5b338 50%,#b98518);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#1c1404;font-weight:800;font-size:13.5px;box-shadow:0 5px 15px rgba(0,0,0,.6)}
@keyframes spinSlow{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
.eth-spin{transform-origin:130px 116px;animation:spinSlow 7s linear infinite}
.eth-spin.fast{animation-duration:3.5s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.dot{animation:blink 1.4s infinite}
.nav{position:fixed;bottom:0;width:100%;max-width:430px;height:66px;background:rgba(11,15,23,.97);border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(5,1fr);z-index:40}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6b7280;font-size:11px;background:none;border:none}
.nav button.on{color:#f6c945;font-weight:700}
.tab{display:none;flex-direction:column;padding:6px 14px 14px;flex:1}.tab.on{display:flex}
#toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#161c28;border:1px solid #f6c945;color:#ffe787;padding:7px 15px;border-radius:99px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
#toast.show{opacity:1}
#wModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:80;align-items:flex-end;justify-content:center}
#wModal.show{display:flex}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app">
<header class="flex items-center justify-between px-3.5 pt-3 pb-1.5">
  <div class="flex items-center gap-2">
    <div class="relative w-8 h-8 flex-shrink-0">
      <div class="w-8 h-8 rounded-full overflow-hidden border border-amber-300/50 shadow">
        <svg viewBox="0 0 64 64" class="w-full h-full">
          <rect width="64" height="64" fill="#b22234"/>
          <rect y="8" width="64" height="6" fill="#fff"/><rect y="20" width="64" height="6" fill="#fff"/><rect y="32" width="64" height="6" fill="#fff"/><rect y="44" width="64" height="6" fill="#fff"/><rect y="56" width="64" height="6" fill="#fff"/>
          <rect width="32" height="34" fill="#3c3b6e"/>
        </svg>
      </div>
      <div class="w-4 h-4 rounded-full bg-[#14171f] border border-amber-400 flex items-center justify-center absolute -bottom-1 -right-1 shadow">
        <svg width="10" height="10" viewBox="0 0 32 32" fill="#F3BA2F">
          <path d="M16 4l3.7 3.7-6.5 6.5-3.7-3.7L16 4zm7.4 7.4L27.1 15l-3.7 3.7-3.7-3.7 3.7-3.6zM8.6 11.4L12.3 15l-3.7 3.7L4.9 15l3.7-3.6zm7.4 1.6l3 3-3 3-3-3 3-3zm0 8.8l6.5-6.5 3.7 3.7L16 29.2l-10.2-10.2 3.7-3.7 6.5 6.5z"/>
        </svg>
      </div>
    </div>
    <div>
      <div class="flex items-center gap-1.5">
        <span class="font-extrabold text-[15px] tracking-wide">US TOKEN</span>
        <span class="flex items-center gap-1 bg-red-950/80 border border-red-500/40 px-1.5 py-0.5 rounded text-[9px] font-bold text-red-400">
          <span class="w-1.5 h-1.5 rounded-full bg-red-500 dot"></span>LIVE
        </span>
      </div>
      <span id="liveClock" class="text-[10px] font-mono text-gray-400">02:14:36</span>
    </div>
  </div>
  <button id="walletBtn" onclick="openWalletModal()" class="flex items-center gap-1 bg-[#1a202c] border border-amber-400/50 px-2.5 py-1.5 rounded-full text-[11px] font-bold text-amber-300 shadow">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 14h.01"/></svg>
    <span id="walletBtnText">Connect Wallet</span>
  </button>
</header>
<p class="text-center text-[11px] text-amber-300/80 px-3 pb-1.5">Wallet Connect will be available after 3 months - 22 Feb 2027</p>
<main id="t-home" class="tab on">
  <div class="card py-2 px-3 text-center mb-1.5">
    <div id="cdTimer" class="font-mono text-[22px] font-extrabold gold">90 days 00:00:00</div>
    <p id="cdSub" class="text-[10.5px] text-gray-400">starts today and runs for 3 months</p>
  </div>
  <div class="flex flex-col items-center my-1">
    <div class="w-[188px] h-[188px] drop-shadow-[0_0_20px_rgba(246,201,69,0.32)]">
      <svg viewBox="0 0 260 260" class="w-full h-full overflow-visible">
        <defs>
          <radialGradient id="g1" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff4b8"/><stop offset="40%" stop-color="#f5c63b"/><stop offset="100%" stop-color="#875807"/></radialGradient>
          <radialGradient id="g2" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#ffe785"/><stop offset="100%" stop-color="#96640a"/></radialGradient>
        </defs>
        <circle cx="130" cy="122" r="102" fill="url(#g1)" stroke="#fff0a6" stroke-width="2"/>
        <circle cx="130" cy="122" r="88" fill="url(#g2)" stroke="#7c5207" stroke-width="2"/>
        <circle cx="130" cy="122" r="78" fill="none" stroke="#fff0a6" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>
        <g id="ethLogo" class="eth-spin">
          <polygon points="130,62 96,118 130,136" fill="#60a5fa"/>
          <polygon points="130,62 164,118 130,136" fill="#1e40af"/>
          <polygon points="130,144 96,126 130,172" fill="#3b82f6"/>
          <polygon points="130,144 164,126 130,172" fill="#172554"/>
        </g>
        <path d="M84 196 Q130 212 176 196 L183 207 Q130 225 77 207 Z" fill="url(#g1)"/>
        <g transform="translate(130,203)">
          <path d="M-23,-19 L23,-19 L23,2 C23,15 0,25 0,25 C0,25 -23,15 -23,2 Z" fill="#172554" stroke="#ffe57f" stroke-width="2.5"/>
          <text x="0" y="8" text-anchor="middle" fill="#fff" font-weight="800" font-size="15">US</text>
        </g>
      </svg>
    </div>
    <h1 class="text-[16px] font-extrabold tracking-wider gold -mt-1">US TOKEN</h1>
  </div>
  <div class="mt-1.5 mb-2">
    <button id="mineBtn" onclick="toggleMining()" class="btn-gold w-full py-3.5 flex items-center justify-center gap-2 text-[15.5px]">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14.5 5.5L18.5 9.5M3 21L13 11M13 6C16.5 6 19.5 8 21 11.5C18.5 10.5 16 10.5 14 11.5C13 13.5 13 16 14 18.5C10.5 17 8.5 14 8.5 10.5"/></svg>
      <span id="mineBtnTxt">START MINING</span>
    </button>
    <p class="text-center text-[11px] text-gray-300 mt-1">
      <span id="statusTxt">Ready to mine</span> • <span id="rateTxt" class="text-amber-300 font-bold">+0.12 US/hour</span>
    </p>
  </div>
  <div class="ribbon">Coming Soon on Exchange</div>
  <div class="grid grid-cols-2 gap-2.5">
    <div class="card p-3 text-center">
      <p class="text-[10px] text-gray-400 font-bold">MINED BALANCE</p>
      <div class="text-[18px] font-extrabold mt-0.5"><span id="balUs">1,245.78</span> US</div>
      <p class="text-[11px] text-amber-300 font-semibold">≈ $<span id="balUsd">623.90</span> USD</p>
    </div>
    <div class="card p-3 text-center">
      <p class="text-[10px] text-gray-400 font-bold">REFERRAL BONUS</p>
      <div class="text-[18px] font-extrabold mt-0.5"><span id="refUs">120.00</span> US</div>
      <p class="text-[11px] text-amber-300 font-semibold">≈ $<span id="refUsd">60.00</span> USD</p>
    </div>
  </div>
</main>
