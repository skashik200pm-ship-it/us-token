<!DOCTYPE html>
<html lang="en">
<head>

<title>US TOKEN</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;padding-bottom:95px}
.header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px}
.flag{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#fff 0 15%,#b22234 15% 30%,#fff 30% 45%,#b22234 45% 60%,#fff 60% 75%,#b22234 75%);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;overflow:hidden;border:1px solid #333}
.flag::after{content:"★";position:absolute;left:2px;top:1px;color:#fff;background:#3c3b6e;padding:1px 3px;font-size:7px}
.logo b{font-size:22px;letter-spacing:.5px}
.live{background:#ff3b30;color:#000;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:900;text-align:center;line-height:1.2}
.live small{font-size:11px;font-weight:800}
.sub{text-align:center;color:#e8c85a;font-size:11px;margin-top:6px}
.hero{text-align:center;padding:16px 0 0;position:relative}
.coin-outer{width:235px;height:235px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 32% 28%, #fff7ae 0%, #ffe95e 18%, #f5c518 38%, #a67c00 68%, #6b4e00 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px #c19a1a, 0 0 60px rgba(245,197,24,.45), inset 0 -12px 24px rgba(0,0,0,.3);position:relative}
.coin-inner{width:200px;height:200px;border-radius:50%;border:2px solid rgba(122,92,0,.6);display:flex;align-items:center;justify-content:center;position:relative}
.coin-inner::before{content:"";position:absolute;inset:8px;border:1px dashed rgba(122,92,0,.4);border-radius:50%}
.diamond{width:0;height:0;border-left:50px solid transparent;border-right:50px solid transparent;border-bottom:70px solid #2b6cff;position:relative;z-index:2;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4))}
.diamond::after{content:"";position:absolute;left:-50px;top:70px;border-left:50px solid transparent;border-right:50px solid transparent;border-top:40px solid #0b3fc0}
.diamond::before{content:"";position:absolute;left:-14px;top:10px;width:28px;height:28px;background:rgba(255,255,255,.6);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.us-pill{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:#0a5cad;border:2px solid #ffd700;color:#fff;padding:6px 18px;border-radius:10px 10px 14px 14px;font-weight:900;font-size:18px;z-index:5;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.hero h1{margin-top:18px;font-size:24px;letter-spacing:2px}
.ribbon{margin:18px 16px;background:linear-gradient(90deg,#b8860b,#ffd700,#fff2a8,#ffd700,#b8860b);color:#111;text-align:center;font-weight:900;padding:13px 10px;font-size:17px;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.box{margin:0 16px;background:#0f0f0f;border:1px solid #262626;border-radius:14px;padding:18px 14px;text-align:center}
.box small{color:#c9b98a;font-size:12px}
.box p{color:#c9b98a;font-size:12px;margin-top:4px}
.box b{color:#ffd700;font-size:30px;display:block;margin-top:4px}
.grid{display:flex;gap:10px;margin:12px 16px}
.mini{flex:1;background:#111;border:1px solid #262626;border-radius:14px;padding:18px 10px;text-align:center}
.mini small{color:#999;font-size:11px;letter-spacing:.5px}
.mini b{font-size:24px;display:block;margin-top:10px}
.mini span{color:#777;font-size:11px}
.btn{margin:6px 16px;width:calc(100% - 32px);background:linear-gradient(180deg,#ffe95e,#f5c518);color:#111;border:none;padding:17px;border-radius:12px;font-size:20px;font-weight:900;cursor:pointer}
.btn:disabled{background:#222;color:#777}
.hint{text-align:center;color:#888;font-size:13px;margin:10px 0 6px}
.note{margin:12px 16px;background:#1a1200;border:1px solid #3a2c00;color:#ffcf7a;padding:12px;border-radius:12px;font-size:12px;line-height:1.6}
.page{display:none}.page.active{display:block}
.task-page{padding:16px}.task-page h2{font-size:22px}.task-page p{color:#aaa;font-size:14px;margin-top:8px;line-height:1.6}
.task-card{margin-top:16px;background:#151515;border:1px solid #2a2a2a;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.task-card button{background:#ffd700;border:none;padding:10px 16px;border-radius:999px;font-weight:800}
.task-card button.done{background:#16a34a;color:#fff}
.wait{margin-top:12px;text-align:center;color:#f5c518;font-size:13px;font-weight:600;min-height:20px}
.check{margin-top:12px;background:#111;border:1px solid #2a2a2a;border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:22px;height:22px;accent-color:#f5c518}
.section{padding:16px}.big-bal{font-size:32px;color:#ffd700;font-weight:900}
.field{width:100%;padding:13px;border-radius:12px;border:1px solid #2a2a2a;background:#111;color:#fff;margin-top:10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f0f;border-top:1px solid #222;display:flex;padding:10px 0 18px;z-index:99}
.nav div{flex:1;text-align:center;color:#777;font-size:11px;cursor:pointer}.nav div.active{color:#ffd700}.nav span{font-size:22px;display:block;margin-bottom:2px}
</style>
</head>
