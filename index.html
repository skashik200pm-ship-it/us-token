
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US TOKEN</title>
<style>
body{background:#0a0f2a;color:white;text-align:center;font-family:sans-serif;padding:20px}
.coin{font-size:80px}
.box{background:#1a2350;padding:20px;border-radius:20px;margin-top:20px}
button{background:#facc15;border:none;padding:15px 30px;font-size:20px;font-weight:bold;border-radius:30px;margin-top:15px}
h1{color:#facc15}
</style>
</head>
<body>
<div class="coin">🪙</div>
<h1>US TOKEN</h1>
<p>Free Mining - Earn Daily</p>
<div class="box">
<h2>Balance</h2>
<h1 id="bal">0.0000 US</h1>
<p id="status">Press START to Mining</p>
<button onclick="start()">START MINING ⛏️</button>
</div>
<script>
let b=0;let on=false;
function start(){
if(on) return; on=true;
document.getElementById('status').innerText='Mining Running...';
setInterval(()=>{b+=0.001;document.getElementById('bal').innerText=b.toFixed(4)+' US'},1000);
}
</script>
</body>
</html>
